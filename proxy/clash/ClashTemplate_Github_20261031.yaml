# 2026.10.31 14:36:31

# GitHub 资源加速
# 主用格式：https://cdn.jsdelivr.net/gh/{owner}/{repo}@{branch}/{path}
# 备用格式：https://fastly.jsdelivr.net/gh/{owner}/{repo}@{branch}/{path}
# gh-proxy 备用格式：https://gh-proxy.com/https://raw.githubusercontent.com/{owner}/{repo}/{branch}/{path}

# xxxxx_provider 可以自定更改
# url: 订阅链接    这里的订阅链接一定要是clash格式，且满足只包含以下格式内容

# proxies:
#   - name: xx
#     type: xx
#     server: xx
#   - name: xxx
#     type: xxx
#     server: xxx
#     ……

log-level: debug
mode: rule
ipv6: true
tcp-concurrent: true
unified-delay: true
mixed-port: 7890
allow-lan: true
bind-address: "*"
lan-allowed-ips:
  - 0.0.0.0/0
  - ::/0
find-process-mode: strict
external-controller: 0.0.0.0:9090

geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
geo-auto-update: true
geo-update-interval: 24

external-controller-cors:
  allow-private-network: true

global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  override-destination: false
  sniff:
    QUIC:
      ports: [ 443 ]
    TLS:
      ports: [ 443 ]
    HTTP:
      ports: [80]


dns:
  enable: true
  prefer-h3: false
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - 'dns.google'
    - "localhost.ptlogin2.qq.com"
  use-hosts: true
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - 1.1.1.1
    - 8.8.8.8
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver-policy:
    "geosite:cn,private":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query

proxy-providers:
  xxxxx_provider:
    type: http
    path: ./xxxxx_provider.yaml
    url: 订阅链接
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300


